<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Servis - Servisku</title>
    <link rel="stylesheet" href="detailservis.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="dashboard.html" class="brand">
            <img src="logo fire.png" alt="Logo Servisku">
            <span>Servisku</span>
        </a>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24">
                    <path d="M3 10.5 12 3l9 7.5" />
                    <path d="M5.5 9v12h13V9M9.5 21v-7h5v7" />
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="kendaraan.html" class="nav-link">
                <svg viewBox="0 0 24 24">
                    <circle cx="7" cy="12" r="4" />
                    <circle cx="17" cy="12" r="4" />
                    <path d="M7 12h10M11 9l2 6" />
                </svg>
                <span>Kendaraan</span>
            </a>

            <a href="servis1.html" class="nav-link active">
                <svg viewBox="0 0 24 24">
                    <path d="m14.5 6.5 3-3a6 6 0 0 0-7.8 7.8L3 18a2.1 2.1 0 0 0 3 3l6.7-6.7a6 6 0 0 0 7.8-7.8l-3 3z" />
                    <path d="m3 3 18 18" />
                </svg>
                <span>Servis</span>
            </a>

            <a href="laporan.html" class="nav-link">
                <svg viewBox="0 0 24 24">
                    <path d="M6 2h9l5 5v15H6z" />
                    <path d="M15 2v6h5M9 12h7M9 16h7" />
                </svg>
                <span>Laporan</span>
            </a>

            <a href="profile.html" class="nav-link">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <circle cx="12" cy="9" r="3" />
                    <path d="M6.5 18a6 6 0 0 1 11 0" />
                </svg>
                <span>Profil</span>
            </a>
        </nav>

    </header>

    <!-- Detail Servis -->

    <main class="detail-main">
        <h1>Detail Servis</h1>

        <a href="servis1.html" class="back-link">
            <span>⟵</span> Kembali ke riwayat
        </a>

        <p id="pesanDetail" class="message" hidden></p>

        <!-- Kartu detail servis tetap dilanjutkan di bawah sini -->

        <main class="detail-container">

            <section class="detail-card">

                <!-- Informasi Kendaraan -->
                <div class="vehicle-header">
                    <div class="vehicle-icon" id="ikonKendaraan">
                        <svg viewBox="0 0 64 64" aria-hidden="true">
                            <path fill="currentColor"
                                d="M13 27 18 13Q20 8 26 8H38Q44 8 46 13L51 27Q58 29 58 37V49Q58 52 55 52H51V57H44V52H20V57H13V52H9Q6 52 6 49V37Q6 29 13 27Z" />
                            <path fill="white" d="M20 16Q21 13 25 13H39Q43 13 44 16L47 26H17Z" />
                            <circle cx="15" cy="39" r="4" fill="white" />
                            <circle cx="49" cy="39" r="4" fill="white" />
                        </svg>
                    </div>

                    <div class="vehicle-heading">
                        <h1 id="namaKendaraan">Avanza</h1>

                        <div class="vehicle-meta">
                            <span id="nomorPlat">BP 1234 KZ</span>
                            <span class="meta-divider"></span>
                            <span id="tahunKendaraan">Tahun 2018</span>
                        </div>
                    </div>
                </div>

                <!-- Rincian Servis -->
                <div class="detail-information">

                    <div class="detail-row">
                        <span class="detail-label">Tanggal Servis</span>
                        <span class="detail-value" id="tanggalServis">
                            12 Mei 2026
                        </span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Jenis Servis</span>
                        <span class="detail-value" id="jenisServis">
                            Ganti Oli Mesin
                        </span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Jarak Tempuh</span>
                        <span class="detail-value" id="jarakTempuh">
                            1980000 km
                        </span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Biaya</span>
                        <span class="detail-value" id="biaya">
                            Rp. 250.000
                        </span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Nama Bengkel</span>
                        <span class="detail-value" id="namaBengkel">
                            Surya Bengkel
                        </span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Catatan</span>
                        <span class="detail-value" id="catatan">
                            Penggantian Oli Mesin dan Filter Oli
                        </span>
                    </div>

                </div>
            </section>

            <!-- Tombol Aksi -->
            <div class="detail-actions">
                <button type="button" class="btn-edit" id="btnEdit">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 4H4v16h16v-8" />
                        <path d="m10 14 9-9 3 3-9 9-4 1z" />
                    </svg>
                    <span>Edit</span>
                </button>

                <button type="button" class="btn-delete" id="btnHapus">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6h18M8 6V3h8v3M6 6l1 15h10l1-15M10 10v7M14 10v7" />
                    </svg>
                    <span>Hapus</span>
                </button>
            </div>

            <p id="pesanDetail" class="detail-message" hidden></p>

        </main>

        <script src="detailservis.js"></script>
</body>

</html>
