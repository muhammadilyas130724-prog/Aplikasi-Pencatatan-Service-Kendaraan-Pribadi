
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Servisku</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="dashboard.html" class="brand">
            <img src="logo fire.png" alt="Logo Servisku">
            <span>Servisku</span>
        </a>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24">
                    <path d="M3 10.5 12 3l9 7.5"/>
                    <path d="M5.5 9v12h13V9M9.5 21v-7h5v7"/>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="kendaraan.html" class="nav-link">
                <svg viewBox="0 0 24 24">
                    <circle cx="7" cy="12" r="4"/>
                    <circle cx="17" cy="12" r="4"/>
                    <path d="M7 12h10M11 9l2 6"/>
                </svg>
                <span>Kendaraan</span>
            </a>

            <a href="servis1.html" class="nav-link">
                <svg viewBox="0 0 24 24">
                    <path d="m14.5 6.5 3-3a6 6 0 0 0-7.8 7.8L3 18a2.1 2.1 0 0 0 3 3l6.7-6.7a6 6 0 0 0 7.8-7.8l-3 3z"/>
                    <path d="m3 3 18 18"/>
                </svg>
                <span>Servis</span>
            </a>

            <a href="laporan.html" class="nav-link">
                <svg viewBox="0 0 24 24">
                    <path d="M6 2h9l5 5v15H6z"/>
                    <path d="M15 2v6h5M9 12h7M9 16h7"/>
                </svg>
                <span>Laporan</span>
            </a>

            <a href="profile.html" class="nav-link active">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <circle cx="12" cy="9" r="3"/>
                    <path d="M6.5 18a6 6 0 0 1 11 0"/>
                </svg>
                <span>Profil</span>
            </a>
        </nav>

    </header>

    <!-- Konten Profil -->
    <main class="profile-container">

        <h1>Profil</h1>

        <!-- Kartu Profil Utama -->
        <section class="profile-card">

            <div class="profile-avatar" aria-label="Foto profil">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <circle
                        cx="60"
                        cy="60"
                        r="53"
                        fill="white"
                        stroke="black"
                        stroke-width="5"
                    />
                    <circle
                        cx="60"
                        cy="43"
                        r="22"
                        fill="black"
                    />
                    <path
                        d="M23 96 Q23 78 42 78 H78 Q97 78 97 96
                           Q60 116 23 96Z"
                        fill="black"
                    />
                </svg>
            </div>

            <div class="profile-heading">
                <h2 id="namaProfil">Uchiha Sasuke</h2>
                <p id="emailProfil">sasuke ganteng1@gmail.com</p>
            </div>

        </section>

        <!-- Informasi Akun -->
        <section class="account-card">

            <h2>Informasi Akun</h2>

            <div class="account-info">
                <div class="info-label">Nama</div>
                <div class="info-value" id="namaAkun">
                    Uchiha Sasuke
                </div>

                <div class="info-label">Email</div>
                <div class="info-value" id="emailAkun">
                    sasukeganteng1@gmail.com
                </div>

                <div class="info-label">Nomor Telepon</div>
                <div class="info-value" id="teleponAkun">
                    0812 3456 7890
                </div>
            </div>

        </section>

        <!-- Tombol Logout -->
        <div class="logout-container">
            <button type="button" class="btn-logout" id="btnLogout">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 3H4v18h6"/>
                    <path d="M14 7l5 5-5 5"/>
                    <path d="M19 12H8"/>
                    <path d="M14 3h5v18h-5"
                        stroke-dasharray="2 3"/>
                </svg>

                <span>Logout</span>
            </button>
        </div>

    </main>

    <script src="profile.js"></script>

</body>
</html>
