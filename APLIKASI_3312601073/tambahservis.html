
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Servis | Servisku</title>
  <link rel="stylesheet" href="tambahservis.css">
</head>
<body>

<nav class="navbar">
    <a href="dashboard.html" class="brand">
      <span class="brand-icon">🚘</span>
      <span>Servis<span class="brand-blue">ku</span></span>
    </a>

    <div class="nav-menu">
      <a href="dashboard.html" class="nav-link">
        <span>⌂</span> Dashboard
      </a>
      <a href="kendaraan.html" class="nav-link">
        <span>🚘</span> Kendaraan
      </a>
      <a href="servis1.html" class="nav-link active">
        <span>⚒</span> Servis
      </a>
      <a href="laporan.html" class="nav-link">
        <span>▤</span> Laporan
      </a>
      <a href="profil.html" class="nav-link">
        <span>☻</span> Profil
      </a>
    </div>
  </nav>

  <main class="main-content">

    <!-- HEADER HALAMAN -->
    <section class="page-heading">
      <div class="heading-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M14 5a5 5 0 0 0-6 6l-5 5 4 4 5-5a5 5 0 0 0 6-6l-4 4-4-4z"/>
          <path d="M15 3l6 6"/>
        </svg>
      </div>

      <div class="heading-copy">
        <h1>Tambah Servis</h1>
        <p>Catat riwayat servis kendaraan Anda dengan mudah dan cepat.</p>
      </div>

      <div class="heading-illustration" aria-hidden="true">
        <span class="illustration-tree">🌳</span>
        <span class="illustration-car">🚙</span>
        <span class="illustration-garage">🔧</span>
      </div>
    </section>

    <!-- FORM TAMBAH SERVIS -->
    <section class="form-card">
      <form id="formTambahServis">

        <div class="form-grid">

          <!-- NAMA KENDARAAN -->
          <div class="form-group">
            <label for="namaKendaraan">
              Nama Kendaraan <span class="required">*</span>
            </label>

            <div class="input-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M5 11l2-5h10l2 5"/>
                  <path d="M3 11h18v7H3z"/>
                  <circle cx="7" cy="15" r="1"/>
                  <circle cx="17" cy="15" r="1"/>
                  <path d="M6 18v2M18 18v2"/>
                </svg>
              </span>

              <select id="namaKendaraan" required>
                <option value="">Pilih kendaraan Anda</option>
              </select>

              <span class="select-arrow" aria-hidden="true">⌄</span>
            </div>
            <small class="field-error" id="errorKendaraan"></small>
          </div>

          <!-- JARAK TEMPUH -->
          <div class="form-group">
            <label for="jarakTempuh">
              Jarak Tempuh (km) <span class="required">*</span>
            </label>

            <div class="input-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 17a8 8 0 1 1 16 0v2H4z"/>
                  <path d="M12 13l4-4"/>
                  <circle cx="12" cy="13" r="1"/>
                  <path d="M7 13h.01M17 13h.01M12 6v1"/>
                </svg>
              </span>

              <input
                type="number"
                id="jarakTempuh"
                min="0"
                step="1"
                placeholder="Masukkan jarak tempuh (km)"
                required
              >
            </div>
          </div>

          <!-- TANGGAL SERVIS -->
          <div class="form-group">
            <label for="tanggalServis">
              Tanggal Servis <span class="required">*</span>
            </label>

            <div class="input-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="5" width="18" height="16" rx="2"/>
                  <path d="M7 3v4M17 3v4M3 10h18"/>
                  <path d="M7 14h2M12 14h2M7 17h2M12 17h2"/>
                </svg>
              </span>

              <input type="date" id="tanggalServis" required>
            </div>
          </div>

          <!-- BIAYA -->
          <div class="form-group">
            <label for="biaya">
              Biaya <span class="required">*</span>
            </label>

            <div class="input-wrap">
              <span class="field-icon currency-icon" aria-hidden="true">Rp</span>

              <input
                type="number"
                id="biaya"
                min="0"
                step="1"
                placeholder="Contoh: 250000"
                required
              >
            </div>
          </div>

          <!-- JENIS SERVIS -->
          <div class="form-group">
            <label for="jenisServis">
              Jenis Servis <span class="required">*</span>
            </label>

            <div class="input-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M14 5a5 5 0 0 0-6 6l-5 5 4 4 5-5a5 5 0 0 0 6-6l-4 4-4-4z"/>
                  <path d="M15 3l6 6"/>
                </svg>
              </span>

              <select id="jenisServis" required>
                <option value="">Pilih jenis servis</option>
                <option value="Ganti Oli Mesin">Ganti Oli Mesin</option>
                <option value="Cek Rem">Cek Rem</option>
                <option value="Ganti Ban">Ganti Ban</option>
                <option value="Ganti Filter Udara">Ganti Filter Udara</option>
                <option value="Servis Mesin">Servis Mesin</option>
                <option value="Servis Berkala">Servis Berkala</option>
                <option value="Ganti Aki">Ganti Aki</option>
                <option value="Lainnya">Lainnya</option>
              </select>

              <span class="select-arrow" aria-hidden="true">⌄</span>
            </div>
          </div>

          <!-- SERVIS SELANJUTNYA -->
          <div class="form-group">
            <label for="servisSelanjutnya">Servis Selanjutnya</label>

            <div class="input-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="5" width="18" height="16" rx="2"/>
                  <path d="M7 3v4M17 3v4M3 10h18"/>
                  <path d="M7 14h2M12 14h2M7 17h2M12 17h2"/>
                </svg>
              </span>

              <input type="date" id="servisSelanjutnya">
            </div>
          </div>

          <!-- NAMA BENGKEL -->
          <div class="form-group full-width">
            <label for="namaBengkel">
              Nama Bengkel <span class="required">*</span>
            </label>

            <div class="input-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M3 10l2-6h14l2 6"/>
                  <path d="M4 10h16v10H4z"/>
                  <path d="M8 20v-6h8v6"/>
                  <path d="M3 10a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/>
                </svg>
              </span>

              <input
                type="text"
                id="namaBengkel"
                placeholder="Masukkan nama bengkel"
                required
              >
            </div>
          </div>

          <!-- CATATAN -->
          <div class="form-group full-width notes-group">
            <label for="catatan">Catatan</label>

            <div class="textarea-wrap">
              <span class="field-icon textarea-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M6 3h9l4 4v14H6z"/>
                  <path d="M15 3v5h4M9 12h7M9 16h7"/>
                </svg>
              </span>

              <textarea
                id="catatan"
                maxlength="300"
                placeholder="Masukkan catatan servis (opsional)"
              ></textarea>
            </div>

            <div class="character-count">
              <span id="jumlahKarakter">0</span>/300
            </div>
          </div>

        </div>

        <!-- TOMBOL -->
        <div class="form-footer">
          <button type="button" id="btnBatal" class="cancel-button">
            <span aria-hidden="true">←</span> Batal
          </button>

          <button type="submit" class="save-button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 3h12l4 4v14H3V3z"/>
              <path d="M7 3v6h10V3M7 21v-8h10v8"/>
            </svg>
            Simpan Servis
          </button>
        </div>

      </form>
    </section>

  </main>

  <script src="tambahservis.js"></script>
</body>
</html>
